<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<style>
    body {
        display: flex;
        flex-flow: column;
        align-items: stretch;
        font-size: 20px;
    }

    p,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        margin: 0;
    }

    .pageview {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .headbar,
    .location {
        /* padding-bottom: 10px;; */
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 5px;
        justify-content: center;
    }

    .location {
        margin-top: 4px;
        padding: 3px;
        padding-left: 10px;
        padding-right: 10px;
        border-radius: 20px;
        border: solid black 1px;
    }

    .hidden {
        display: none;
    }

    .topcontrols {
        display: flex;
        flex-flow: row wrap;
        align-items: center;
        align-self: center;
        justify-content: space-around;
        min-width: 700px;
        gap: 17px;
    }

    .grow {
        display: flex;
        flex-grow: 1;
    }

    .spaceholder {
        visibility: hidden;
    }

    .websitename {
        padding-right: 20px;
    }

    .location {
        /* padding-bottom: 10px; */
    }

    .pagenote {
        padding-bottom: 10px;
        font-style: italic;
        align-items: center;
        display: flex;
        flex-direction: column;
    }

    .name {
        padding-bottom: 10px;
        padding-top: 10px;
        text-decoration: underline;

        max-width: 600px;
        overflow: hidden;
        text-overflow: ellipsis;
        text-wrap: nowrap;
        float: left;
    }

    .linkbutton {
        max-width: 100px;
        overflow: hidden;
        text-overflow: ellipsis;
        text-wrap: nowrap;
        float: left;
    }


    .easybutton {
        --padding-lr: 4px;
        padding-left: var(--padding-lr);
        padding-right: var(--padding-lr);
        --padding-tb: 0;
        padding-top: var(--padding-tb);
        padding-bottom: var(--padding-tb);
        background: lightgrey;
        border-radius: 0px;
        outline: 1px solid black;

    }

    a:not(.pageview a) {
        text-decoration: unset;
        color: unset;
    }

    a:not(.pageview a):hover {
        text-decoration: underline;
    }

    .debuginfo {
        font-size: 10px;
        color: grey;
        align-self: center;
        padding: 20px;
        padding-top: 40px;
        position: fixed;
        bottom: 0;
        right: 0;
    }
</style>

<body>
    <div class="headbar">
        <a href="$homeurl"><span class="websitename">Website</span></a>
        $quicklinks
    </div>
    <div class="location $shouldihide">
        $currentlocation :
    </div>
    <div class="topcontrols">
        <a href="..">
            <div class="upbutton easybutton">
                ^ folder </div>
        </a>
        <div class="name">$itemname</div>
        <div class="upbutton easybutton spaceholder">
            ^ folder </div>
    </div>
    <div class="pagenote">$note</div>

    <div class="pageview">
        $page
    </div>

    <div class="debuginfo">
        $debuginfo
    </div>
</body>

</html>
