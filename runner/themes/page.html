<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>$pagetitle</title>
</head>
<style>
    :root {
        --width: min(400px, 90vw);

    }

    html {
        overflow-y: scroll;
        overflow-x: scroll;
    }

    body {
        display: flex;
        position: relative;
        flex-flow: column;
        align-items: center;
        font-size: 20px;
        margin: 0;
        margin-bottom: 20px;

        overflow-y: visible;
        overflow-x: visible;
    }

    p,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        margin: 0;
    }

    .pageview {
        display: flex;
        flex-flow: column;
        justify-content: center;
        align-items: center;
        /* margin-top: 20px; */
        align-self: center;
        width: min(1000px, 90vw)
    }

    :root {
        --sillywidth: 100px;
    }

    .webpage {}

    .containtopper {
        max-width: max(440px, calc(100vw - var(--sillywidth) * 2))
    }

    .webpage .easybutton {
        padding: 2px;
    }

    .topleft {
        width: var(--sillywidth);
        /* position: absolute; */
        /* margin: 10px; */
        max-height: 1px;
        overflow: visible;
        margin-right:10px;
        line-height: 63%;
    }
    .topright,.topleft{
        position:absolute
    }

    .topleft {
        left: 0;
        top: 0;
    }

    .topright {
        right: 0;
        top: 0;
    }

    .headbar,
    .location {

        min-width: 400px;
        /* padding-bottom: 10px;; */
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 5px;
        justify-content: right;
    }

    .typednode {
        display: flex;
        flex-flow: row;
        align-items: center;
        justify-content: flex-start;
        gap: 5px;
    }

    .iconmoney:empty {
        display: none;
    }


    .location {
        margin-top: 4px;
        padding: 3px;
        padding-left: 10px;
        padding-right: 10px;
        /* border-radius: 20px; */
        border-top: solid black 1px;
    }

    .hidden {
        display: none !important;
    }

    .transparent {
        opacity: 60%;
    }

    .topcontrols {
        display: flex;
        flex-flow: row wrap;
        align-items: flex-end;
        align-self: center;
        justify-content: center;
        /* justify-content: space-around; */
        /* min-width: 700px; */
        gap: 7px;
    }

    .upbutton {
        min-width: 20px;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .grow {
        display: flex;
        flex-grow: 1;
    }

    .spaceholder {
        visibility: hidden;
    }

    a:has(>.websitename) {
        flex-grow: 1;
    }

    .websitename {
        padding-right: 20px;
    }

    .containheader {
        width: 100%;
        /* border: solid black 1px; */
        border-top: none;
        /* border-bottom-right-radius: 50px; */
        /* border-bottom-left-radius: 50px; */
        padding: 7px;
        --padding-lr: 30px;
        padding-left: var(--padding-lr);
        padding-right: var(--padding-lr);
    }

    .containtopper {
        width: 100%;
        display: flex;
        flex-flow: row nowrap;
        align-items: center;
        justify-content: center;
        gap: 5px;
    }

    .location {
        /* padding-bottom: 10px; */
        display: flex;
        flex-flow: row wrap;
        max-width: 500px;
        align-content: center;
        justify-content: center;
    }

    .linkbutton {
        display: flex;
        flex-flow: row;
        align-items: center;

        /* max-width: min(480px, 80vw); */
        max-width: min(480px, calc(100% - 20px));
        overflow: hidden;
        text-overflow: ellipsis;
        text-wrap: nowrap;
        text-align: left;
        float: left;
    }

    .location .linkbutton:nth-last-child(1) {
        font-weight: bold;
    }

    .typednode {
        /* filter:saturate(40%) brightness(86%) contrast(130%) */
    }

    .pagenote {
        width: min(1000px, 90vw);
        font-size: 17px;

        padding: 10px;
        /* font-style: italic; */
        align-items: center;
        display: flex;
        flex-direction: column;
        text-align: center;
    }

    .name {
        padding-bottom: 10px;
        padding-top: 10px;
        text-decoration: underline;

        max-width: 600px;
        overflow: hidden;
        text-overflow: ellipsis;
        text-wrap: nowrap;
        float: left;
    }

    .bold {
        font-weight: bold;
    }

    .bottomarrows [href=" "] {
        /* display: none; */
        opacity: 20%;
    }

    .playingcontainer {
        color: rgb(0, 133, 173) !important;
        transition: 0s color !important;
    }

    .playingcontainer:not(.fadetonormal) {}

    .fadetonormal {
        transition: 3s color;
    }

    .easybutton {
        --padding-lr: 10px;
        padding-left: var(--padding-lr);
        padding-right: var(--padding-lr);
        --padding-tb: 6px;
        padding-top: var(--padding-tb);
        padding-bottom: var(--padding-tb);
        /* background: lightgrey; */
        /* border-radius: 20px; */
        outline: 1px solid black;

        display: flex;
        flex-flow: column;
        height: 28px;
        align-items: center;
        justify-content: center;

    }

    .spacer {
        width: 6px;
    }

    a:not(.normallink, .normallink a) {
        text-decoration: unset;
        color: unset;
    }

    a:not(.normallink, .normallink a):not(.entryicon):hover:not(:has(*)):not(.dontunderline, .dontunderline *),
    a:not(.normallink, .normallink a):not(.entryicon):hover *:not(:has(*)):not(.dontunderline, .dontunderline *) {
        text-decoration: underline;
        cursor: pointer;
    }

    .containheader .entryicon>img {
        height: 1.5em;
        width: 1.5em;
        --undospace: -0.25em;
        margin-top: var(--undospace);
        margin-bottom: var(--undospace);
    }


    /* The initial state of the page */
    #app-view {
        transition: opacity 0.2s ease-in-out, transform 0.2s ease-in-out;
        opacity: 1;
        transform: translateY(0);
    }

    /* The state during the swap */
    .pagetrix-swapping #app-view {
        opacity: 0;
        transform: translateY(10px);
        /* Slight slide down effect */
    }


    #topright:has(#usernametext:empty) {

        .signupbutton {
            display: flex;
        }

        .usernamebox {
            display: none;
        }
    }

    #topright:has(#usernametext):not(:has(#usernametext:empty)) {

        .signupbutton {
            display: none;
        }

        .usernamebox {
            display: flex;
        }

    }

    #topright {

        .usernamebox:not(.active) {
            .dropdownmenu {
                display: none !important;
            }

            .dropdownarrow {
                rotate: 270deg;
            }
        }

        .usernamebox.active {
            .dropdownmenu {
                display: flex !important;
            }

            .dropdownarrow {
                rotate: 90deg;
            }
        }

    }

    .usernamebox {

        .dropdownarrow {
            transition: 0.2s;
        }

        display: flex;
        flex-flow: column;

        .usernamebutton {
            display: flex;
            flex-flow: row nowrap;
            gap: 5px;


        }

        .dropdownmenu {
            border: solid black 1px;
            display: flex;
            flex-flow: column;

            .dditem {
                border-top: solid black 1px;
                padding: 5px;
            }
        }

    }



    .bottomarrows {
        display: flex;
        flex-flow: row nowrap;
        gap: 5px;
        /* margin-top: 20px; */
        margin: 0;
    }

    .bottomarrows * {
        --padding-tb: 0 !important;
    }


    .debuginfo {
        font-size: 10px;
        color: grey;
        align-self: center;
        padding: 20px;
        padding-top: 40px;
        position: fixed;
        bottom: 0;
        right: 0;
    }

    .pagetrix-persist {
        align-content: center;
        justify-content: center;
        display: flex;
    }

    .ITEM {
        position: relative;
    }

    .delete-button {
        z-index: 10;
        display: flex;
        opacity: 0%;
        transition: 0.1s;

        --dimension: 30px;

        width: var(--dimension);
        height: var(--dimension);

        position: absolute;

        top: calc(-0.5 * var(--dimension));
        right: calc(-0.5 * var(--dimension));
    }

    .notmysite .delete-button {
        display: none !important;
    }

    .ITEM:hover .delete-button {
        opacity: 100%;
    }

    .delete-button:hover {
        scale: 110%;
        filter: brightness(110%);
    }

    .notmysite .drop-zone {
        display: none !important;
    }

    /* The hidden overlay */
    #drop-zone {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        right: 0;
        /* width: 100vw;
        height: 100vh; */
        background: rgba(245, 135, 0, 0.8);
        /* background: rgba(0, 120, 215, 0.8); */
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        visibility: hidden;
        /* Hidden until drag starts */
        opacity: 0;
        transition: opacity 0.3s;
        border: 5px dashed white;
        box-sizing: border-box;
    }

    /* Class to show the zone */
    #drop-zone.active {
        visibility: visible;
        opacity: 1;
    }


    .newitem {
        position: fixed;
        right: 20vw;
        bottom: 30px;
        z-index: 100;
    }
</style>

<script data-pagetrix-once>
    // only happens once!
    function navigateNextPrevPage() {
        window.location.href = ""
    }

    window.addEventListener('keydown', e => {
        if (e.repeat) return;
        if (e.key == 'ArrowLeft') {
            pagetrix.goto(document.querySelector('a:has(>.leftarrow)').getAttribute('href'))
            // location.href = document.querySelector('a:has(>.leftarrow)').getAttribute('href')
        } else if (e.key == 'ArrowRight') {
            pagetrix.goto(document.querySelector('a:has(>.rightarrow)').getAttribute('href'))
            // location.href = document.querySelector('a:has(>.rightarrow)').getAttribute('href')
        } else if (e.key == 'Escape') {
            e.stopPropagation()
            e.preventDefault()
            pagetrix.goto('..')
            // location.href+=document.querySelector('a:has(>.nextarrow)').getAttribute('href')

            // location.href+='/'+document.querySelector('a:has(>.backarrow)').getAttribute('href')
        }
    })

    console.log('ello')
</script>

<script data-pagetrix-once src="$enginewebpath/scripts/magicutils.js"></script>
<script src="$enginewebpath/scripts/magicmouse.js" data-pagetrix-once></script>





<body>
    $audioplayerelem
    <script src="$enginewebpath/scripts/audioplayer.js" data-pagetrix-once></script>

    <div id="drop-zone" class="pagetrix-persist drop-zone">
        <h1>Upload File</h1>
    </div>

    <div class="containtopper">
        <a href=".." class="$shouldbackbuttonhideAlone">

            <div class="upbutton location $shouldbackbuttonhideAlone">
                ↖ </div>
        </a>



        <div class="containheader">
            <div class="headbar">


                <div id="topleft" class="pagetrix-persist webpage topleft">
                    <a href="https://micahpowch.com" class="easybutton">
                        < explore swampish</a>
                </div>
                <a href="$homeurl"><span class="websitename $boldifathome">$websitename</span></a>
                $quicklinks
            </div>

            <div class="topcontrols">

                <div class="location $shouldihide $shouldhidepath">
                    $currentlocation
                </div>

            </div>



        </div>

        <div id="topright" class="pagetrix-persist website topright">
            <a href="https://login.micahpowch.com/signup.html" class="easybutton signupbutton">sign up</a>
            <div id="usernamebox" class="usernamebox"
                onclick="document.querySelector('#usernamebox').classList.toggle('active')">
                <a class="easybutton usernamebutton">
                    <span id="usernametext"></span>
                    <span>
                        <div class="dropdownarrow dontunderline"> > </div>
                    </span>
                </a>
                <div class="dropdownmenu">
                    <a class="dditem" id="mysitebutton">my site</a>
                    <a class="dditem" id="logoutbutton">log out</a>
                </div>
            </div>
        </div>

        <div class="upbutton location spaceholder $shouldbackbuttonhideAlone">
            ↖ </div>
    </div>

    <div class="bottomarrows $shouldhidecontrols">
        <a href=".." class="$shouldbackbuttonhide">

            <div class="easybutton $shouldbackbuttonhideFriends">
                ↖ </div>
        </a>

        <div class="spacer"></div>
        <a href="$downloadpath" download>

            <div class="easybutton downloadbutton $showdownloadbutton">
                <img height=20 src="$enginewebpath/images/download-button.svg" />
            </div>
        </a>
        <a href="">

            <div class="easybutton savebutton"> ☆ </div>
        </a>
        <a href="" onclick="print()">

            <div class="easybutton printbutton"> 🖶 </div>
        </a>
        <div class="spacer"></div>
        <a href="$nextlink">
            <div class="easybutton leftarrow"> ← </div>
        </a>
        <a href="$prevlink">

            <div class="easybutton rightarrow"> → </div>
        </a>
    </div>
    <div class="pagenote">$note</div>

    <div class="pageview">
        <!-- <div class="leftarrow"> < </div> -->
        <!-- <div class="rightarrow"> > </div> -->
        $pagehtml
    </div>
    <br>

    <div class="easybutton newitem" onclick="createNewFolderHere()" href=".">+📁</div>

    <div class="debuginfo">
        $debuginfo
    </div>


</body>
