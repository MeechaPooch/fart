<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>$pagetitle</title>
</head>
<style>
    body {
        display: flex;
        flex-flow: column;
        align-items: center;
        font-size: 20px;
        margin: 0;
        margin-bottom: 20px;

        
    }

    p,
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
        margin: 0;
    }

    .pageview {
        display: flex;
        flex-flow: column;
        justify-content: center;
        align-items: center;
        /* margin-top: 20px; */
        align-self: center;
        width:min(1000px, 90vw)
    }

    .headbar,
    .location {
        /* padding-bottom: 10px;; */
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        gap: 5px;
        justify-content: center;
    }

    .typednode {
        display: flex;
        flex-flow: row;
        align-items: center;
        justify-content: flex-start;
        gap: 5px;
    }

    .iconmoney:empty {
        display: none;
    }


    .location {
        margin-top: 4px;
        padding: 3px;
        padding-left: 10px;
        padding-right: 10px;
        /* border-radius: 20px; */
        border-top: solid black 1px;
    }

    .hidden {
        display: none !important;
    }

    .topcontrols {
        display: flex;
        flex-flow: row wrap;
        align-items: flex-end;
        align-self: center;
        justify-content: center;
        /* justify-content: space-around; */
        /* min-width: 700px; */
        gap: 7px;
    }

    .upbutton {
        min-width: 20px;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .grow {
        display: flex;
        flex-grow: 1;
    }

    .spaceholder {
        visibility: hidden;
    }

    .websitename {
        padding-right: 20px;
    }

    .containheader {
        /* border: solid black 1px; */
        border-top: none;
        /* border-bottom-right-radius: 50px; */
        /* border-bottom-left-radius: 50px; */
        padding: 7px;
        --padding-lr: 30px;
        padding-left: var(--padding-lr);
        padding-right: var(--padding-lr);
    }

    .containtopper {
        display: flex;
        flex-flow: row nowrap;
        align-items: flex-end;
        justify-content: center;
        gap: 5px;
    }

    .location {
        /* padding-bottom: 10px; */
        display: flex;
        flex-flow: row wrap;
        max-width: 500px;
    }

    .linkbutton {
        max-width: 480px;
        overflow: hidden;
        text-overflow: ellipsis;
        text-wrap: nowrap;
        text-align: left;
        float: left;
    }

    .location .linkbutton:nth-last-child(1) {
        font-weight: bold;
    }

    .typednode {
        /* filter:saturate(40%) brightness(86%) contrast(130%) */
    }

    .pagenote {
        width:min(1000px, 90vw);
        font-size:17px;
       
        padding: 10px;
        /* font-style: italic; */
        align-items: center;
        display: flex;
        flex-direction: column;
        text-align: center;
    }

    .name {
        padding-bottom: 10px;
        padding-top: 10px;
        text-decoration: underline;

        max-width: 600px;
        overflow: hidden;
        text-overflow: ellipsis;
        text-wrap: nowrap;
        float: left;
    }

    .bottomarrows [href="undefined"] {
        display: none;
    }


    .easybutton {
        --padding-lr: 10px;
        padding-left: var(--padding-lr);
        padding-right: var(--padding-lr);
        --padding-tb: 6px;
        padding-top: var(--padding-tb);
        padding-bottom: var(--padding-tb);
        /* background: lightgrey; */
        /* border-radius: 20px; */
        outline: 1px solid black;

        display: flex;
        flex-flow: row;

    }

    .spacer{
        width:3px;
    }

    a:not(.normallinks a) {
        text-decoration: unset;
        color: unset;
    }

    a:not(.normallinks a):not(.entryicon):hover {
        text-decoration: underline;
    }

    .bottomarrows {
        display: flex;
        flex-flow: row nowrap;
        gap: 5px;
        /* margin-top: 20px; */
        margin:0;
    }
    .bottomarrows * {
        --padding-tb:0 !important;
    }


    .debuginfo {
        font-size: 10px;
        color: grey;
        align-self: center;
        padding: 20px;
        padding-top: 40px;
        position: fixed;
        bottom: 0;
        right: 0;
    }
</style>
<script src="/micahpowch/engineassets/scripts/magicutils.js"></script>

<body>
    <div class="containtopper">
        <a href=".." class="$shouldbackbuttonhide">

            <div class="upbutton location $shouldbackbuttonhideAlone">
                ↖ </div>
        </a>
        <div class="containheader">
            <div class="headbar">
                <a href="$homeurl"><span class="websitename">$websitename</span></a>
                $quicklinks
            </div>

            <div class="topcontrols">

                <div class="location $shouldihide">
                    $currentlocation
                </div>

            </div>


        </div>
        <div class="upbutton location spaceholder $shouldbackbuttonhide">
            ← </div>
    </div>

      <div class="bottomarrows">
         <a href=".." class="$shouldbackbuttonhide">

            <div class="easybutton $shouldbackbuttonhideFriends">
                ↖ </div>
        </a>
        <div class="spacer"></div>
        <a href="$nextlink">
            <div class="easybutton leftarrow"> ← </div>
        </a>
        <a href="$prevlink">

            <div class="easybutton rightarrow"> → </div>
        </a>
    </div>
    <div class="pagenote">$note</div>

    <div class="pageview">
        <!-- <div class="leftarrow"> < </div> -->
        <!-- <div class="rightarrow"> > </div> -->
        $pagehtml
    </div>
    <br>
  

    <div class="debuginfo">
        $debuginfo
    </div>
</body>
<!-- todo update engineassets dir -->
<script src="/micahpowch/engineassets/scripts/magicmouse.js"></script>

</html>

<script>
    function navigateNextPrevPage() {
        window.location.href = ""
    }



    document.addEventListener('keydown',e=>{
    console.log(e)
    if(e.key=='ArrowLeft') {
        location.href=document.querySelector('a:has(>.leftarrow)').getAttribute('href')
    } else if (e.key=='ArrowRight') {
        location.href=document.querySelector('a:has(>.rightarrow)').getAttribute('href')
    } else if (e.key=='Escape') {
        e.stopPropagation()
        e.preventDefault()
        location.href+='..'
        // location.href+=document.querySelector('a:has(>.nextarrow)').getAttribute('href')

        // location.href+='/'+document.querySelector('a:has(>.backarrow)').getAttribute('href')
    }
})

console.log('ello')
</script>
