<!DOCTYPE html>
<html>

<body>
    <div class="player">

        <div class="top">
            <div class="image">
                <img src="$imageurl">
            </div>
            <div class="words">
                <div class="title">$title</div>
                <div class="artist">by $artist</div>
                <div class="albumstats">$year&nbsp;| $trackcount&nbsp;tracks |&nbsp;$minutelength&nbsp;minutes</div>
            </div>
        </div>
        <div class="tracks">
            $tracks
        </div>

        <div class="controls paused">
            <div class="gobutton" onclick="audioplayer.toggle()">
                <span class="playerplayingbuttonicon">⏸</span>
                <span class="playerpausedbuttonicon">▶</span>

            </div>
            <div class="scrubber">
                <input type="range" min="0" max="1000" value="0" class="audioprogress"
                    onchange="audioplayer.seektopercent(document.querySelector('.audioprogress').value/1000)">
                <!-- <div class="circle">
                    <svg height="10" width="10" xmlns="http://www.w3.org/2000/svg">
                        <circle r="5" cx="5" cy="5" fill="black" />
                    </svg>
                </div>-->
                <div class="line"></div>
            </div>
            <div class="time">
                <span class="playercurrentime">2:04</span>/<span class="playerduration">3:43</span>
            </div>
        </div>
    </div>
</body>
<style>
    @import url('https://fonts.googleapis.com/css2?family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap');
</style>
<style>
    body {
        display: flex;
        flex-flow: column;
        align-items: center;
    }

    .player,
    .player * {
        display: flex;
        align-items: stretch;
        /* font-family: Sn-pro; */
        gap: 10px;
        font-size: 16px;
    }

    .player {
        flex-flow: column;
        width: var(--width);
        --width: 400px;
        margin-top: 20px;

    }

    .top {
        flex-flow: row nowrap;
        align-items: flex-start;
    }

    .image {
        width: 170px;
        height: 170px;
        outline: solid black 2px;
        aspect-ratio: 1;
    }

    .image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .words {
        flex-flow: column;
        justify-content: flex-start;
    }

    .title {
        font-weight: bold;
        font-size: 30px;
        text-wrap: wrap;
    }

    .albumstats {
        text-wrap: wrap;
        max-width: 220px;
    }

    .tracks {
        flex-flow: column;
        align-items: stretch;
        gap: 0px;
    }

    .audiotrack {
        flex-flow: row nowrap;
        /* min-height: 20px; */
        cursor: pointer;
        padding: 11px;
        align-items: center;
        /* background-color: rgba(211, 211, 211, 0.317); */
        text-decoration: none;
    }

    .audiotrack.trackplaying,
    .audiotrack.trackpaused {
        color: rgb(0, 133, 173);
        /* color:rgb(0, 173, 0); */
    }

    .audiotrack.trackplaying .buggon {}

    .buggon {
        width: 15px;
        height: 0px;
        display: flex;
        flex-flow: column;
        justify-content: center;
        align-items: center;
    }

    .trackplayingicon,
    .tracknotplayingicon,
    .trackpausedicon,
    .trackplayinghover,
    .trackpausedhover {
        display: none;
    }

    .trackplayingicon {
        /* translate:-5px; */
    }

    .audiotrack.trackplaying:not(:hover) .trackplayingicon {
        display: inline-block;
    }

    .audiotrack.trackplaying:hover .trackplayinghover {
        display: inline-block;
    }

    .audiotrack.trackpaused:hover .trackpausedhover {
        display: inline-block;
    }

    .audiotrack.trackpaused:not(:hover) .trackpausedicon {
        display: inline-block;
    }

    .audiotrack:not(.trackplaying):not(.trackpaused) .tracknotplayingicon {
        display: inline-block;
    }


    .audiotrack:hover {
        background-color: rgba(0, 174, 255, 0.086);
        /* background-color: rgba(211, 211, 211, 0.254); */
    }

    .divider {
        background-color: rgba(0, 0, 0, 0.514);
        height: 0.8px;
        width: 100%;
    }

    .audiotrack:not(:last-child) {}

    .albumtrackspace {
        flex-grow: 1;
    }
    .albumtrackname {
        text-wrap:wrap;
    }

    .controls {
        flex-flow: row;
        outline: solid black 2px;
        padding: 13px;
        position: fixed;
        bottom: 10px;
        width: calc(var(--width) - 13px * 2);
        background-color: white;
    }

    body {
        margin-bottom: 80px;
    }

    .scrubber {
        flex-grow: 1;
        position: relative;
        align-items: center;
        flex-flow: row;
    }

    .controls * {
        display: flex;
        flex-flow: row;
        align-items: center;
        justify-content: center;
    }

    .gobutton{
        cursor: pointer;
        width:20px;
        height:20px;
    }
    .playerpausedbuttonicon,
    .playerplayingbuttonicon {
        display: none;
    }

    .controls.playing .playerplayingbuttonicon {
        display: inline-block;
    } 
    /* todo rename .controls to .player */

    .controls.paused .playerpausedbuttonicon {
        display: inline-block;
    }

    .scrubber .audioprogress {
        width: 100%;

        background: none;
        color: black;
        appearance: none;
        height: 100%;
        cursor: pointer;
        border-radius: 10px;
    }

    .audioprogress::-webkit-slider-thumb,
    .audioprogress::-moz-range-thumb {
        -webkit-appearance: none;
        background: white;
        border: solid 2px black;
        --diameter: 12px;
        height: var(--diameter);
        width: var(--diameter);
    }

    .scrubber>.circle {
        position: absolute;
    }

    .scrubber>.line {
        width: 100%;
        position: absolute;
        height: 2px;
        background-color: black;
        z-index: -10;
    }

    .controls .time {
        gap: 5px;
    }
</style>

<script>

    // document.querySelectorAll('.audiotrack').forEach(e=>e.addEventListener('click',()=>{playme()}))

    console.log('hello')
    function playme(trackindex) {
        audioplayer.playurls(getPlaylist(), trackindex, true)
    }

    function getPlaylist() {
        return [...document.querySelectorAll('.audiotrack')].map(track => track.getAttribute('x-trackurl'))
    }
</script>

</html>
