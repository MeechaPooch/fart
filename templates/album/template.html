<!DOCTYPE html>
<html>

<body>
    <div class="player">

        <div class="top">
            <div class="image">
                <img src="$imageurl">
            </div>
            <div class="words">
                <div class="title fadetonormal" x-asseturl="$🚨assetweburl">$title</div>
                <div class="artist">by $artist</div>
                <div class="albumstats">$year&nbsp;| $trackcount&nbsp;tracks |&nbsp;$minutelength&nbsp;minutes</div>
            </div>
        </div>
        <div class="tracks">
            $tracks
        </div>

    </div>
</body>
<style>
    @import url('https://fonts.googleapis.com/css2?family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap');
</style>
<style>
    body {
        display: flex;
        flex-flow: column;
        align-items: center;
    }

    .player,
    .player * {
        display: flex;
        align-items: stretch;
        /* font-family: Sn-pro; */
        gap: 10px;
        font-size: 16px;
    }

    .player {
        flex-flow: column;
        width: var(--width);
        /* --width: 400px; */
        margin-top: 20px;

    }

    .top {
        flex-flow: row nowrap;
        align-items: flex-start;
    }

    .image {
        width: 170px;
        height: 170px;
        outline: solid black 2px;
        aspect-ratio: 1;
    }

    .image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .words {
        flex-flow: column;
        justify-content: flex-start;
    }

    .title {
        font-weight: bold;
        font-size: 30px;
        text-wrap: wrap;
    }

    .albumstats {
        text-wrap: wrap;
        max-width: 220px;
    }

    .tracks {
        flex-flow: column;
        align-items: stretch;
        gap: 0px;
    }

    .audiotrack {
        flex-flow: row nowrap;
        /* min-height: 20px; */
        cursor: pointer;
        padding: 11px;
        align-items: center;
        /* background-color: rgba(211, 211, 211, 0.317); */
        text-decoration: none;
    }

    .audiotrack.trackplaying,
    .audiotrack.trackpaused {
        color: rgb(0, 133, 173);
        /* color:rgb(0, 173, 0); */
    }

    .audiotrack.trackplaying .buggon {}

    .buggon {
        width: 15px;
        height: 0px;
        display: flex;
        flex-flow: column;
        justify-content: center;
        align-items: center;
    }

    .trackplayingicon,
    .tracknotplayingicon,
    .trackpausedicon,
    .trackplayinghover,
    .trackpausedhover {
        display: none;
    }

    .trackplayingicon {
        /* translate:-5px; */
    }

    .audiotrack.trackplaying:not(:hover) .trackplayingicon {
        display: inline-block;
    }

    .audiotrack.trackplaying:hover .trackplayinghover {
        display: inline-block;
    }

    .audiotrack.trackpaused:hover .trackpausedhover {
        display: inline-block;
    }

    .audiotrack.trackpaused:not(:hover) .trackpausedicon {
        display: inline-block;
    }

    .audiotrack:not(.trackplaying):not(.trackpaused) .tracknotplayingicon {
        display: inline-block;
    }


    .audiotrack:hover {
        background-color: rgba(0, 174, 255, 0.086);
        /* background-color: rgba(211, 211, 211, 0.254); */
    }

    .divider {
        background-color: rgba(0, 0, 0, 0.514);
        height: 0.8px;
        width: 100%;
    }

    .audiotrack:not(:last-child) {}

    .albumtrackspace {
        flex-grow: 1;
    }
    .albumtrackname {
        text-wrap:wrap;
    }

</style>

<script>

    // document.querySelectorAll('.audiotrack').forEach(e=>e.addEventListener('click',()=>{playme()}))

    console.log('hello')
    function playme(trackindex) {
        audioplayer.playurls(getPlaylist(), trackindex, true)
    }

    function getPlaylist() {
        return [...document.querySelectorAll('.audiotrack')].map(track => track.getAttribute('x-trackurl'))
    }

    audioplayeraddons.setPlayingElement()
    audioplayeraddons.setPlayerStatusClass()
</script>

</html>
