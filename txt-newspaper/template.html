<!DOCTYPE html>
<head>
    <link href="style.css" rel="stylesheet"/>
</head>
<html>

<body>
<div class="page">
<div class="title">
    $title
</div>
<div class="about">
    <span class="byline">by <span class="whoby">$author</span></span> |
    <span class="whenline"><span class="whenpub">$publish_date</span></span>
</div>
<br>
<div class="article">$content
</div>
</div>
</body>



<style>
    @font-face {
    font-family: nyt-body;
    src: url(fonts/cheltenham-normal-500.ttf);
}
@font-face {
    font-family: nyt-title;
    src: url(fonts/imperial-normal-700.ttf);
}

* {
    font-size: 20px;;
    font-family: nyt-body;
}
.title {
    font-family: nyt-title;
    font-size: 40px;;
}
.article{
    white-space: pre-wrap;
}
.page {
    max-width: 800px;
}
body{
    display: flex;
    flex-flow:column;
    align-items: center;
}
</style>

</html>
