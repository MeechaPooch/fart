<!DOCTYPE html>
<html>

<body>

        </div>
        <div class="tracks">
            <div class="track">
                <div class="buggon">▶︎</div>

            </div>
            <div class="divider"></div>
            <div class="track">
                <div class="buggon">▶︎</div>
                <div class="name">Back to Black</div>

            </div>
            <div class="divider"></div>
            <div class="track">
                <div class="buggon">▶︎</div>
                <div class="name">Back to Black</div>
                <div class="space"></div>
                <div class="duration">3:05</div>
            </div>
            <div class="divider"></div>
            <div class="track">
                <div class="buggon">▶︎</div>
                <div class="name">Back to Black</div>
                <div class="space"></div>
                <div class="duration">3:05</div>
            </div>
        </div>

        <div class="controls">
            <div class="gobutton">▶︎</div>
            <div class="scrubber">
                <div class="circle">
                    <svg height="10" width="10" xmlns="http://www.w3.org/2000/svg">
                        <circle r="5" cx="5" cy="5" fill="black" />

                </div>
                <div class="line"></div>
            </div>
            <div class="time">2:04 / 3:43</div>
        </div>

<style>
    @import url('https://fonts.googleapis.com/css2?family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap');
</style>
<style>
    body {
        display: flex;
        flex-flow: column;
        align-items: center;
    }

    .player,
    .player * {
        display: flex;
        align-items: stretch;
        /* font-family: Sn-pro; */
        gap: 10px;
    }

    .player {
        flex-flow: column;
        width: 400px;
    }

    .top {
        flex-flow: row wrap;
        align-items: flex-start;
    }

    .image {
        width: 170px;
        height: 170px;
        outline: solid black 2px;
    }

    .image img {
        width: 100%;
        height: 100%;
        object-fit: contain;
    }

    .words {
        flex-flow: column;
        justify-content: flex-start;
    }

    .title {
        font-weight: bold;
        font-size: 30px;
        text-wrap: wrap;
    }
    .albumstats{
        text-wrap: wrap;
        max-width: 220px;
    }

    .tracks {
        flex-flow: column;
        align-items: stretch;
        gap: 0px;
    }

    .track {
        flex-flow: row wrap;
        /* min-height: 20px; */
        cursor: pointer;
        padding: 13px;
        align-items: center;
        /* background-color: rgba(211, 211, 211, 0.317); */
    }

    .track:hover {
        background-color: rgba(211, 211, 211, 0.254);
    }

    .divider {
        background-color: rgba(0, 0, 0, 0.514);
        height: 0.8px;
        width: 100%;
    }

    .track:not(:last-child) {}

    .space {
        flex-grow: 1;
    }

    .controls {
        flex-flow: row;
        outline: solid black 2px;
        padding: 13px;
    }

    .scrubber {
        flex-grow: 1;
        position: relative;
        align-items: center;
        flex-flow: row;
    }

    .scrubber>.circle {
        position: absolute;
    }

    .scrubber>.line {
        width: 100%;
        position: relative;
        height: 2px;
        background-color: black;
    }
</style>

</html>
